name: JUnit Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Install Playwright Browsers
      run: mvn -B test-compile dependency:build-classpath -Dmdep.outputFile=cp.txt
        && java -cp "target/test-classes:target/classes:$(cat cp.txt)" com.microsoft.playwright.CLI install --with-deps chromium
    - name: Run tests
      run: mvn -B test
